services:
  db:
    image: postgres:16-alpine
    container_name: ai_sav_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: sav_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d sav_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ai_sav_backend
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+asyncpg://postgres:${POSTGRES_PASSWORD}@db:5432/sav_db
      APP_ENV: development
      DEBUG: "true"
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    # Permet au conteneur de joindre un service tournant sur l'hôte (ex.
    # Ollama, cf. OLLAMA_BASE_URL=http://host.docker.internal:11434/v1) —
    # résolu nativement par Docker Desktop, ajouté explicitement pour Linux.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    # Migrations puis seed idempotent (rôles + premier admin si configuré)
    # avant de démarrer l'API : un `docker compose up -d` sur une base vierge
    # doit suffire, sans étape manuelle.
    command: >
      sh -c "cd app && alembic upgrade head && python -m app.database.seed &&
      uvicorn app.main:app --host 0.0.0.0 --port 8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 5
      # Marge généreuse : sur base vierge, migrations + seed + premier import
      # des libs ML peuvent prendre jusqu'à ~1-2 min au tout premier démarrage.
      start_period: 60s

volumes:
  postgres_data:
